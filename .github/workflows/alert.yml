name: signal-alert

on:
  schedule:
    # UTC 00:05 = 北京 08:05（加密日线 08:00 收盘后）
    - cron: "5 0 * * *"
  workflow_dispatch:

concurrency:
  group: signal-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check signals and push
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python check_push.py

      - name: Commit state
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add alert_state.json || true
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: update alert state [skip ci]"
            git push
          fi
